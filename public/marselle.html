<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 50th Birthday Marselle — Passport to Fifty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>

      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            handwriting: ['"Caveat"', 'cursive'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            sand: {
              50: '#FDFBF7',
              100: '#F7F1E5',
              200: '#EDE2CE',
              300: '#DECBA9',
            },
            terracotta: {
              400: '#D47656',
              500: '#C45D3B',
              600: '#A5482A',
              700: '#7D341E',
            },
            ocean: {
              400: '#3C8C94',
              500: '#276B73',
              600: '#1D5259',
              700: '#143B40',
            },
            gold: {
              300: '#E8C56B',
              400: '#D4A843',
              500: '#B5892A',
            },
            espresso: {
              800: '#2A211B',
              900: '#1B1511',
            }
          },
          boxShadow: {
            polaroid: '0 14px 28px -8px rgba(27, 21, 17, 0.16), 0 4px 10px -3px rgba(27, 21, 17, 0.08)',
            polaroidHover: '0 24px 42px -10px rgba(27, 21, 17, 0.24), 0 8px 16px -4px rgba(196, 93, 59, 0.16)',
            voucher: '0 25px 60px -15px rgba(20, 59, 64, 0.28), 0 10px 25px -8px rgba(181, 137, 42, 0.2)',
          }
        }
      }
    }
  </script>

  <style>
    .topo-bg {
      background-color: #FDFBF7;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(212, 118, 86, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 88% 24%, rgba(39, 107, 115, 0.08) 0%, transparent 48%),
        radial-gradient(circle at 50% 85%, rgba(212, 168, 67, 0.09) 0%, transparent 50%);
    }

    .vintage-map-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
      overflow: hidden;
      mix-blend-mode: multiply;
    }

    .vintage-map-svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
    }

    header,
    main,
    footer,
    #toastBanner {
      position: relative;
      z-index: 10;
    }

    #toastBanner {
      position: fixed;
      z-index: 50;
    }

    .dashed-route {
      background-image: repeating-linear-gradient(
        to right,
        rgba(196, 93, 59, 0.35) 0,
        rgba(196, 93, 59, 0.35) 8px,
        transparent 8px,
        transparent 16px
      );
      height: 2px;
    }

    .reveal-item {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal-item.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .compass-spin {
      animation: spinSlow 45s linear infinite;
    }

    @keyframes floatBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .gift-float {
      animation: floatBob 4s ease-in-out infinite;
    }

    .gift-stage {
      perspective: 1100px;
    }

    .gift-rotator {
      position: relative;
      width: 190px;
      height: 190px;
      margin: 0 auto;
      transform-style: preserve-3d;
      transition: transform 0.25s ease-out;
      cursor: pointer;
    }

    .gift-rotator.auto-spin {
      animation: giftSpin3D 11s linear infinite;
    }

    .gift-rotator.paused {
      animation-play-state: paused;
    }

    @keyframes giftSpin3D {
      0%   { transform: rotateX(-18deg) rotateY(0deg); }
      50%  { transform: rotateX(-18deg) rotateY(180deg); }
      100% { transform: rotateX(-18deg) rotateY(360deg); }
    }

    .gift-face {
      position: absolute;
      width: 190px;
      height: 160px;
      top: 30px;
      left: 0;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      backface-visibility: visible;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.12);
    }

    .gift-front  { transform: translateZ(95px); background: linear-gradient(145deg, #C45D3B, #9E4326); }
    .gift-back   { transform: rotateY(180deg) translateZ(95px); background: linear-gradient(145deg, #A5482A, #7D341E); }
    .gift-right  { transform: rotateY(90deg) translateZ(95px); background: linear-gradient(145deg, #B55030, #8C3B21); }
    .gift-left   { transform: rotateY(-90deg) translateZ(95px); background: linear-gradient(145deg, #B55030, #8C3B21); }
    .gift-bottom { transform: rotateX(-90deg) translateZ(65px); background: #6E2B17; }

    .ribbon-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 30px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #C6962D, #F2D37E, #C6962D);
      box-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .ribbon-h {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 24px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, #C6962D, #F2D37E, #C6962D);
      opacity: 0.92;
    }

    .gift-lid-assembly {
      position: absolute;
      top: 0;
      left: -6px;
      width: 202px;
      height: 44px;
      transform-style: preserve-3d;
      transform-origin: bottom center;
      transition: transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
    }

    .gift-box-opened .gift-lid-assembly {
      transform: translate3d(0, -82px, -35px) rotateX(68deg) rotateZ(-10deg);
    }

    .lid-face {
      position: absolute;
      width: 202px;
      height: 44px;
      top: 0;
      left: 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .lid-front  { transform: translateZ(101px); background: linear-gradient(145deg, #D47656, #B55030); }
    .lid-back   { transform: rotateY(180deg) translateZ(101px); background: linear-gradient(145deg, #B55030, #8C3B21); }
    .lid-right  { transform: rotateY(90deg) translateZ(101px); background: linear-gradient(145deg, #C45D3B, #9E4326); }
    .lid-left   { transform: rotateY(-90deg) translateZ(101px); background: linear-gradient(145deg, #C45D3B, #9E4326); }
    .lid-top    {
      width: 202px;
      height: 202px;
      top: -79px;
      transform: rotateX(90deg);
      background: linear-gradient(135deg, #DF8566, #C45D3B);
    }

    .lid-ribbon-v {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 32px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #C6962D, #F4D88A, #C6962D);
    }

    .lid-top-ribbon-x {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 32px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #C6962D, #F4D88A, #C6962D);
    }

    .lid-top-ribbon-y {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 32px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, #C6962D, #F4D88A, #C6962D);
    }

    .bow-knot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%) translateZ(10px);
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, #FCE49C, #D4A843 65%, #966D18);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    .polaroid-card {
      background: #FFFFFF;
      padding: 14px 14px 22px 14px;
      border-radius: 6px;
      box-shadow: 0 14px 28px -8px rgba(27, 21, 17, 0.16), 0 4px 10px -3px rgba(27, 21, 17, 0.08);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
    }

    .polaroid-card:hover {
      transform: rotate(0deg) translateY(-8px) scale(1.02) !important;
      box-shadow: 0 24px 42px -10px rgba(27, 21, 17, 0.24), 0 8px 16px -4px rgba(196, 93, 59, 0.16);
      z-index: 20;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(260px) rotate(540deg) scale(0.7);
        opacity: 0;
      }
    }

    .confetti-piece {
      position: absolute;
      top: 10px;
      border-radius: 3px;
      pointer-events: none;
      animation: confettiFall 1.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F1E5;
    }
    ::-webkit-scrollbar-thumb {
      background: #D4A843;
      border-radius: 9999px;
      border: 2px solid #F7F1E5;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C45D3B;
    }
  </style>
</head>
